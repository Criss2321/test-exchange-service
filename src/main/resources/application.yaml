spring:
  application:
    name: test-exchange-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    openfeign:
      client:
        config:
          exchangeRateApi:
            connect-timeout: 3000
            read-timeout: 3000

exchange-rate:
  api:
    base-url: https://v6.exchangerate-api.com/v6
    key: ${EXCHANGE_RATE_API_KEY:3635bb7bf1393d87c4dd5155}

resilience4j:
  retry:
    instances:
      exchangeRateApi:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - feign.RetryableException
          - feign.FeignException$FeignServerException
  circuitbreaker:
    instances:
      exchangeRateApi:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - feign.RetryableException
          - feign.FeignException$FeignServerException

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
