spring:
  application:
    name: test-exchange-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    openfeign:
      client:
        config:
          exchangeRateApi:
            connect-timeout: 3000
            read-timeout: 3000

exchange-rate:
  api:
    base-url: https://v6.exchangerate-api.com/v6
    key: ${EXCHANGE_RATE_API_KEY:}
    resiliencia:
      reintento:
        max-intentos: 2
        espera: 300ms
      circuito:
        ventana: 10
        llamadas-minimas: 5
        porcentaje-fallos: 50
        espera-abierto: 30s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
